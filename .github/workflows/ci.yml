name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # socat: the end-to-end test runs the SessionStart hook's relay for real
      - run: sudo apt-get update && sudo apt-get install -y socat
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package (dry run)
        run: npx vsce package --no-dependencies --out claude-sandbox-vscode.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: claude-sandbox-vscode-vsix
          path: claude-sandbox-vscode.vsix
